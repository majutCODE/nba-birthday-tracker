name = "nba-birthday-cron"
main = "index.js"
compatibility_date = "2026-10-07"

# 17:00 UTC = 1pm EDT / 6pm BST, and noon EST / 5pm GMT once the clocks
# change - lunchtime in the US and early evening in the UK either way,
# comfortably before tip-off. Cloudflare honours this to the minute, unlike
# GitHub's scheduler.
#
# The 17:30 repeat is a cheap retry: the bot's once-per-day guard means the
# second one is a no-op if the first already posted.
[triggers]
crons = ["0 17 * * *", "30 17 * * *"]

# GITHUB_TOKEN is set as an encrypted secret, never in this file:
#   wrangler secret put GITHUB_TOKEN
# or Workers > Settings > Variables > Add > Encrypt.
