name: Tweet NBA birthdays

on:
  schedule:
    # Runs every 15 minutes rather than once a day at a fixed UTC time.
    # GitHub's schedule trigger can be delayed by hours on lower-traffic
    # repos (we saw a once-daily 22:00 UTC cron actually firing around
    # 07:36-07:40 UTC instead) — frequent schedules get processed far more
    # reliably. The script itself only actually posts once it's the target
    # hour in US Eastern time, and only once per day, so almost all of
    # these invocations exit immediately without calling any API.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, bypassing the time/once-per-day gates

permissions:
  contents: write # needed to commit bot/last_posted.txt back to the repo

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Post today's birthdays
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python bot/tweet_birthdays.py

      - name: Commit last_posted.txt if it changed
        if: github.event_name != 'workflow_dispatch'
        run: |
          # git status --porcelain (not git diff) — the state file starts out
          # untracked, and git diff reports nothing for untracked files, so
          # the original check never fired and the file was never persisted.
          if [ -n "$(git status --porcelain bot/last_posted.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bot/last_posted.txt
            git commit -m "Record today's birthday tweet as posted [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "No change to bot/last_posted.txt, nothing to commit."
          fi
