name: Tweet NBA birthdays

on:
  schedule:
    # Hourly across the evening ET window (22:00-03:00 UTC == 18:00-23:00
    # EDT), not every 15 minutes. Polling every 15 min queued ~96 runs/day
    # and GitHub started cancelling them before they ever picked up a
    # runner, which is what produced the failure emails. Six well-spaced
    # runs get honored far more reliably; the script posts on the first one
    # at or after 6pm ET and the once-per-day guard ignores the rest.
    - cron: "0 22,23,0,1,2,3 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, bypassing the time/once-per-day gates

permissions:
  contents: write # only for the monthly keep-alive commit at the end of this job

concurrency:
  # Never let two runs race on the shared "already posted" state.
  group: tweet-birthdays
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # State lives in the Actions cache, NOT a commit to main. Committing
      # last_posted.txt back to main retriggered the GitHub Pages build on
      # every post, and overlapping Pages builds cancel each other, which
      # generated "workflow cancelled" emails. restore-keys does prefix
      # matching and returns the most recently created match, so each run
      # restores whatever the previous run saved.
      - name: Restore last-posted state
        uses: actions/cache/restore@v4
        with:
          path: bot/last_posted.txt
          key: last-posted-${{ github.run_id }}
          restore-keys: last-posted-

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Post today's birthdays
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python bot/tweet_birthdays.py

      - name: Save last-posted state
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: bot/last_posted.txt
          key: last-posted-${{ github.run_id }}

      # GitHub disables scheduled workflows after 60 days of repository
      # inactivity. Until Aug 2026 the bot's own daily state commit kept the
      # repo active; moving that state into the cache (to stop the Pages
      # rebuild emails) silently removed the only recurring activity, and
      # GitHub duly warned the schedule was about to be switched off.
      #
      # So: one empty commit a month. Enough to reset the 60-day clock with
      # plenty of slack, rare enough that the Pages rebuild it triggers is a
      # non-event, and it piggybacks on this workflow, which demonstrably
      # does run, rather than on a separate schedule that might be throttled.
      - name: Keep repository active
        if: github.event_name == 'schedule'
        continue-on-error: true # a failed keep-alive must never fail the tweet job
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago."
          if [ "$age_days" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled workflow alive (GitHub disables it after 60 days idle)"
            git push
            echo "Pushed keep-alive commit."
          else
            echo "Recent enough; no keep-alive commit needed."
          fi
