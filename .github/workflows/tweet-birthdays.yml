name: Tweet NBA birthdays

on:
  schedule:
    # Target: ~1pm ET / 6pm UK, before tip-off. 17:00 UTC is 1pm EDT (noon
    # EST) and 6pm BST (5pm GMT), so it holds up either side of the clock
    # changes.
    #
    # Measured over 60 runs: GitHub lands the first cron of the day within
    # about an hour, but delays later ones by 3-6.7 hours. So these all sit
    # at or before the target and the script's window (noon-4:59pm ET)
    # discards anything that drifts past it. Previously the crons sat in the
    # evening and a delayed run tweeted at 10pm ET / 3am UK.
    - cron: "0 17,18,19,20 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Who triggered this. 'cron' = external Cloudflare scheduler (obeys the posting window and once-per-day guard); anything else = a human testing, which bypasses both."
        required: false
        default: manual

permissions:
  contents: write # only for the monthly keep-alive commit at the end of this job

concurrency:
  # Never let two runs race on the shared "already posted" state.
  group: tweet-birthdays
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # State lives in the Actions cache, NOT a commit to main. Committing
      # last_posted.txt back to main retriggered the GitHub Pages build on
      # every post, and overlapping Pages builds cancel each other, which
      # generated "workflow cancelled" emails. restore-keys does prefix
      # matching and returns the most recently created match, so each run
      # restores whatever the previous run saved.
      - name: Restore last-posted state
        uses: actions/cache/restore@v4
        with:
          path: bot/last_posted.txt
          key: last-posted-${{ github.run_id }}
          restore-keys: last-posted-

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Post today's birthdays
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ github.event.inputs.source }}
        run: python bot/tweet_birthdays.py

      - name: Save last-posted state
        if: always() && (github.event_name == 'schedule' || github.event.inputs.source == 'cron')
        uses: actions/cache/save@v4
        with:
          path: bot/last_posted.txt
          key: last-posted-${{ github.run_id }}

      # Two jobs in one, because they want the same cadence:
      #
      # 1. data/players.json is the offline fallback for the bot and the
      #    website, and it silently rots as players change teams (by Oct
      #    2026 the Aug snapshot had 54 players on the wrong team).
      # 2. GitHub disables scheduled workflows after 60 days of repository
      #    inactivity. Until Aug 2026 the bot's daily state commit kept the
      #    repo active; moving that state into the cache removed the only
      #    recurring activity and GitHub warned the schedule was about to
      #    be switched off.
      #
      # Refreshing the snapshot monthly produces a commit, which resets the
      # 60-day clock with plenty of slack. --allow-empty means we still get
      # that commit when no roster actually changed. It rides on this
      # workflow, which demonstrably runs, rather than a separate schedule
      # GitHub might throttle.
      - name: Refresh roster snapshot and keep repository active
        if: github.event_name == 'schedule' || github.event.inputs.source == 'cron'
        continue-on-error: true # must never fail the tweet job
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago."
          if [ "$age_days" -lt 30 ]; then
            echo "Recent enough; nothing to do."
            exit 0
          fi
          # A failed refresh leaves the old snapshot in place; still commit
          # so the schedule stays alive.
          python bot/refresh_snapshot.py || echo "Snapshot refresh failed; keeping the existing file."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          git commit --allow-empty -m "Refresh roster snapshot [skip ci]"
          git push
          echo "Pushed."
