name: Tweet NBA birthdays

on:
  schedule:
    # 22:00 UTC ≈ 6:00pm US Eastern (5:00pm during EST in winter, since
    # cron here is fixed UTC and doesn't shift for US daylight saving).
    # The script itself computes "today" in America/New_York regardless of
    # exactly when this fires, so the DST drift only affects the clock time
    # it posts at, not which date's birthdays it reports.
    - cron: "0 22 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Post today's birthdays
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python bot/tweet_birthdays.py
